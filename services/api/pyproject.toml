[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "districtiq-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
 "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "geoalchemy2>=0.17,<1", "psycopg[binary]>=3.2,<4",
 "httpx>=0.28,<1", "openai>=2,<3", "pandas>=2.2,<3", "geopandas>=1,<2",
 "shapely>=2.1,<3", "pyproj>=3.7,<4", "numpy>=2,<3", "openpyxl>=3.1,<4", "xlrd>=2.0,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=short"
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL/PostGIS", "live: calls official public services"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.isort]
known-first-party = ["app", "pipelines"]
