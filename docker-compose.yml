services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-districtiq}
      POSTGRES_USER: ${POSTGRES_USER:-districtiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-districtiq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-districtiq}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-districtiq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-districtiq}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/repo/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata:
